<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--side:#16233A;--side2:#22334F;--bg:#F2F4F7;--card:#fff;--ink:#18212F;--mute:#5E6B7E;--line:#E2E6EC;--brand:#0B63CE;--brand-d:#094FA5;--ok:#0E7A4F;--ok-bg:#E3F4EC;--use:#A15C00;--use-bg:#FDF0DA;--bad:#B4261E;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#0E1522;--card:#17202F;--ink:#E7ECF4;--mute:#97A4B8;--line:#27344A;--brand:#4C9AFF;--brand-d:#78B2FF;--ok:#4ADE9B;--ok-bg:#12332A;--use:#F5B54A;--use-bg:#3A2B10;--bad:#FF7A70;--side:#0A101B;--side2:#17202F}}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:#C9D3E3;padding:22px 14px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff;font-weight:600;font-size:17px}
.logo i{width:30px;height:30px;border-radius:7px;background:var(--brand);display:grid;place-items:center}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;color:#8696AE}
main{min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 32px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:19px;font-weight:600}
.ops{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.srv{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.dot.up{background:var(--ok)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
select,input[type=text],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
select:focus,input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(11,99,206,.18)}
.content{padding:28px 32px 48px;max-width:1280px}
.alert{display:flex;gap:10px;align-items:center;background:var(--use-bg);color:var(--use);border:1px solid var(--use);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:18px 20px}
.kpi small{color:var(--mute);font-size:13px}
.kpi b{display:block;font-size:30px;font-weight:600;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--use);transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
.card h2{font-size:15px;font-weight:600;padding:16px 20px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row div{min-width:0;flex:1}.row small{display:block;color:var(--mute)}.row time{color:var(--mute);font-size:12px;white-space:nowrap}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tools input,.tools select{flex:1;min-width:180px;max-width:340px}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.del:hover{color:var(--bad);border-color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:12px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border:0}tbody tr:hover{background:rgba(120,140,170,.07)}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.acts{display:flex;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:500}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.use{background:var(--use-bg);color:var(--use)}
.av{width:30px;height:30px;border-radius:50%;background:var(--side2);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.u{display:flex;align-items:center;gap:10px}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
dialog{border:0;border-radius:12px;padding:0;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,16,27,.55)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:14px}
dialog h3{font-size:17px}dialog p{color:var(--mute)}
label{display:flex;flex-direction:column;gap:5px;font-weight:500}label small{font-weight:400;color:var(--mute)}
.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:var(--side);color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--ok);max-width:340px;animation:in .25s}
.toast.err{border-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:1000px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:8;flex-direction:row;padding:6px;border-top:1px solid var(--side2)}
.logo,.side-foot{display:none}nav{flex-direction:row;width:100%;justify-content:space-around}
nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}nav a.on{box-shadow:none;color:var(--brand-d);background:none}
header{padding:12px 16px;position:static}.content{padding:18px 16px 96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== HERO ANIMADO ===== */
.hero{position:relative;overflow:hidden;margin:-28px -32px 24px;min-height:500px;color:#fff;background:linear-gradient(120deg,#0A1730 0%,#0E3A6B 55%,#0B6FA8 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 14s ease-in-out infinite alternate}
.b1{width:440px;height:440px;background:#1FA2FF;opacity:.45;top:-140px;left:8%}
.b2{width:380px;height:380px;background:#00D4B1;opacity:.28;bottom:-160px;right:26%;animation-duration:18s}
.b3{width:320px;height:320px;background:#6C5CE7;opacity:.30;top:15%;right:-90px;animation-duration:22s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 72% 50%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 72% 50%,#000,transparent 70%)}
.hero-in{position:relative;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:24px;padding:72px 48px 130px;min-height:500px}
.hero h2{font-size:clamp(38px,5.4vw,66px);line-height:1.04;font-weight:600;letter-spacing:-.025em;max-width:11em}
.hero p{font-size:clamp(16px,1.6vw,20px);line-height:1.5;max-width:30em;margin-top:20px;color:#D5E3F5}
.hero-bt{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.hbtn{position:relative;overflow:hidden;display:inline-block;padding:14px 28px;border-radius:4px;font-weight:600;color:#fff;text-decoration:none;border:2px solid #fff;transition:transform .2s,background .2s}
.hbtn.pri{background:#2E9BEB;border-color:#2E9BEB}
.hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}.hbtn.pri:hover{background:#4AAEF5}
.hbtn:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg)}
.hbtn:hover:after{left:130%;transition:left .6s}
.hero-tx>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.hero-tx p{animation-delay:.12s}.hero-bt{animation-delay:.24s}
.radar{position:relative;width:min(300px,70%);aspect-ratio:1;justify-self:center;display:grid;place-items:center;animation:up 1s .2s both}
.radar i{position:absolute;inset:0;border:1.5px solid rgba(140,205,255,.6);border-radius:50%;animation:ring 3.6s ease-out infinite}
.radar i:nth-child(2){animation-delay:1.2s}.radar i:nth-child(3){animation-delay:2.4s}
@keyframes ring{from{transform:scale(.38);opacity:1}to{transform:scale(1.15);opacity:0}}
.radar svg{width:42%;height:auto;padding:22px;box-sizing:content-box;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);border-radius:50%;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:float 4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}
.scan .radar i{animation-duration:1.1s}.scan .radar svg{box-shadow:0 0 0 8px rgba(46,155,235,.35),0 0 60px 10px rgba(46,155,235,.7)}
.live{position:absolute;right:32px;bottom:28px;width:min(380px,calc(100% - 64px));background:rgba(8,14,26,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:14px 20px;display:flex;flex-direction:column;gap:2px;animation:up .9s .5s both}
.live small{color:#9FB4D0;font-size:12.5px;display:flex;align-items:center;gap:8px}
.live small:before{content:"";width:8px;height:8px;border-radius:50%;background:#35D68C;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,214,140,.6)}100%{box-shadow:0 0 0 10px rgba(53,214,140,0)}}
.live b{font-size:19px;font-weight:600}.live span{color:#C3D2E8;font-size:13px}
.scan .live{border-color:#2E9BEB;box-shadow:0 0 28px rgba(46,155,235,.5)}
/* ===== MOVIMENTO GERAL ===== */
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#view>.kpis,#view>.grid2,#view>.card,#view>.tools{animation:up .5s both}
.kpi{transition:transform .25s,box-shadow .25s}.kpi:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,35,60,.12)}
.row,#tb tr{animation:up .5s both}
.btn{transition:transform .15s,border-color .2s,background .2s}.btn:active{transform:scale(.97)}
.toast{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@media(max-width:820px){.hero{margin:-18px -16px 20px;min-height:0}.hero-in{grid-template-columns:1fr;padding:44px 22px 40px;min-height:0}.radar{width:150px}.live{position:relative;right:auto;bottom:auto;margin:0 22px 22px;width:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i><svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg></i>Smart Stock</div>
  <nav id="nav">
    <a href="#painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Painel</a>
    <a href="#ferramentas"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Ferramentas</a>
    <a href="#usuarios"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5.5-5-6.5"/></svg>Usuários</a>
    <a href="#historico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</a>
  </nav>
  <div class="side-foot">Controle de ferramentas por RFID</div>
</aside>
<main>
  <header>
    <h1 id="titulo">Painel</h1>
    <div class="ops">
      <div class="srv"><span class="dot" id="dot"></span><span id="srv">Conectando…</span></div>
      <div class="srv"><span class="dot" id="dotL"></span><span id="leitor">Leitor RFID</span></div>
      <label class="who" style="flex-direction:row;font-weight:400">Operador no leitor
        <select id="ativo" aria-label="Operador ativo"></select></label>
    </div>
  </header>
  <div class="content" id="view"></div>
</main>
</div>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const m=/(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]} ${m[4]}`:(s||'-')};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const livre=s=>String(s||'').trim().toLowerCase()==='disponível';
const chip=s=>livre(s)?'<span class="chip ok">Disponível</span>':'<span class="chip use">Em uso</span>';
const acaoChip=a=>a==='Retirada'?'<span class="chip use">Retirada</span>':'<span class="chip ok">Devolução</span>';
const ICON={edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>'};
const S={ferr:[],users:[],hist:[],resumo:null,ativo:null,ultimoId:null};

async function api(url,method,body){
  const r=await fetch(url,method?{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.erro||'Não foi possível concluir a operação.');
  return d;
}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),4500)}

/* ---------- diálogos ---------- */
function formDialog({title,fields,submit,onSubmit}){
  const d=$('#dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}<input type="text" name="${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.readonly?'readonly':''} required autocomplete="off">${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>${f.ler?'<button type="button" class="btn sm" data-ler style="align-self:flex-start">Ler tag no leitor</button>':''}`).join('')}
  <div class="fa"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">${esc(submit)}</button></div></form>`;
  d.querySelector('[data-ler]')?.addEventListener('click',e=>lerTag(e.currentTarget,d.querySelector('input[name=uid]')));
  d.querySelector('[data-x]').onclick=()=>d.close();
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));try{await onSubmit(v);d.close()}catch(er){toast(er.message,true)}};
  d.showModal();d.querySelector('input:not([readonly])')?.focus();
}

async function lerTag(btn,input){
  const rotulo='Ler tag no leitor';
  let base=0;
  try{base=(await api('/api/leitor')).ultimaTag?.ts||0;await api('/api/leitor/cadastro','POST',{ativo:true})}
  catch(e){toast(e.message,true);return}
  S.lendo=true;btn.disabled=true;btn.textContent='Aproxime a tag do leitor…';
  const fim=Date.now()+30000;
  const parar=async txt=>{clearInterval(t);S.lendo=false;btn.disabled=false;btn.textContent=txt;try{await api('/api/leitor/cadastro','POST',{ativo:false})}catch{}};
  const t=setInterval(async()=>{
    if(!$('#dlg').open||Date.now()>fim){parar(rotulo);return}
    try{const l=await api('/api/leitor');
      if(l.ultimaTag&&l.ultimaTag.ts>base){input.value=l.ultimaTag.uid;parar('Ler novamente');toast('Tag lida: '+l.ultimaTag.uid)}}catch{}
  },700);
}
function confirmDialog(title,msg,label,onOk){
  const d=$('#dlg');
  d.innerHTML=`<form><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="fa"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" style="background:var(--bad);border-color:var(--bad)">${esc(label)}</button></div></form>`;
  d.querySelector('[data-x]').onclick=()=>d.close();
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await onOk();d.close()}catch(er){d.close();toast(er.message,true)}};
  d.showModal();
}

/* ---------- dados ---------- */
async function carregar(){
  const [r,f,u,h,a]=await Promise.all([api('/api/resumo'),api('/api/ferramentas'),api('/api/usuarios'),api('/api/historico'),api('/api/usuario-ativo')]);
  Object.assign(S,{resumo:r,ferr:f,users:u,hist:h,ativo:a.usuario});
  S.ultimoId=h[0]?.id??0;
  desenharOperador();
}
function desenharOperador(){
  const s=$('#ativo');
  s.innerHTML=`<option value="">Selecione…</option>`+S.users.map(u=>`<option value="${u.id}" ${S.ativo?.id===u.id?'selected':''}>${esc(u.nome)} (${esc(u.matricula)})</option>`).join('');
}
$('#ativo').onchange=async e=>{
  if(!e.target.value){return}
  try{const r=await api('/api/usuario-ativo','POST',{usuario_id:e.target.value});S.ativo=r.usuario;toast(`Operador definido: ${r.usuario.nome}`);render()}catch(er){toast(er.message,true)}
};

/* ---------- telas ---------- */
function hero(r){
  const m=r.recentes[0],novo=Date.now()-(S.pulse||0)<3000;
  return `<section class="hero${novo?' scan':''}"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="gridbg"></div>
  <div class="hero-in"><div class="hero-tx"><h2>Cada ferramenta, sempre no lugar certo.</h2><p>Aproxime a tag do leitor e o Smart Stock registra quem retirou, quando saiu e quando voltou.</p><div class="hero-bt"><a class="hbtn pri" href="#ferramentas">Ver ferramentas</a><a class="hbtn" href="#historico">Abrir histórico</a></div></div>
  <div class="radar" aria-hidden="true"><i></i><i></i><i></i><svg viewBox="0 0 120 120"><rect x="24" y="36" width="72" height="48" rx="9"/><path d="M38 54h24M38 66h16"/><circle cx="78" cy="60" r="7"/></svg></div></div>
  <div class="live"><small>Última movimentação</small>${m?`<b>${esc(m.nome)}</b><span>${esc(m.usuario||'Usuário removido')} · ${m.acao} · ${fmt(m.data_hora)}</span>`:`<b>Aguardando a primeira tag</b><span>Aproxime uma tag do leitor.</span>`}</div></section>`;
}
function anima(){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('[data-n]').forEach(el=>{
    const to=+el.dataset.n;if(rm||!to){el.textContent=to;return}
    const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
  });
  requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'));
  document.querySelectorAll('.row,#tb tr').forEach((e,i)=>e.style.animationDelay=Math.min(i,10)*45+'ms');
}
const V={
painel(){
  const r=S.resumo,uso=S.ferr.filter(f=>!livre(f.status));
  const quem=f=>S.hist.find(h=>h.uid===f.uid&&h.acao==='Retirada');
  const pct=r.totalFerramentas?Math.round(r.retiradas/r.totalFerramentas*100):0;
  return `${hero(r)}${S.ativo?'':`<div class="alert"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Selecione o operador no topo da página antes de aproximar uma tag. Sem operador, a movimentação não é registrada.</div>`}
  <div class="kpis">
    <div class="card kpi"><small>Ferramentas cadastradas</small><b data-n="${r.totalFerramentas}">0</b></div>
    <div class="card kpi"><small>Disponíveis</small><b style="color:var(--ok)" data-n="${r.disponiveis}">0</b></div>
    <div class="card kpi"><small>Em uso</small><b style="color:var(--use)" data-n="${r.retiradas}">0</b><div class="bar"><span data-w="${pct}" style="width:0"></span></div></div>
    <div class="card kpi"><small>Usuários</small><b data-n="${r.totalUsuarios}">0</b></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Em uso agora</h2>${uso.length?uso.map(f=>{const q=quem(f);return `<div class="row"><div><b>${esc(f.nome)}</b><small>${q?esc(q.usuario||'Usuário removido'):'—'}</small></div><time>${q?fmt(q.data_hora):''}</time></div>`}).join(''):`<div class="empty"><b>Nenhuma ferramenta em uso</b>Todas estão no estoque.</div>`}</div>
    <div class="card"><h2>Atividade recente</h2>${r.recentes.length?r.recentes.map(m=>`<div class="row"><span class="av">${ini(m.usuario)}</span><div><b>${esc(m.nome)}</b><small>${esc(m.usuario||'Usuário removido')} · ${m.acao}</small></div><time>${fmt(m.data_hora)}</time></div>`).join(''):`<div class="empty"><b>Sem movimentações</b>Aproxime uma tag do leitor para registrar a primeira.</div>`}</div>
  </div>`;
},
ferramentas(){
  return `<div class="tools"><input type="search" id="q" placeholder="Buscar por nome ou UID" aria-label="Buscar"><span class="sp"></span><button class="btn pri" id="novo">${ICON.plus}Nova ferramenta</button></div>
  <div class="card tw"><table><thead><tr><th>Ferramenta</th><th>UID RFID</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
},
usuarios(){
  return `<div class="tools"><span class="sp"></span><button class="btn pri" id="novo">${ICON.plus}Novo usuário</button></div>
  <div class="card tw"><table><thead><tr><th>Nome</th><th>Matrícula</th><th>Leitor</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
},
historico(){
  return `<div class="tools"><input type="search" id="q" placeholder="Buscar ferramenta, usuário ou matrícula" aria-label="Buscar"><select id="ac" aria-label="Filtrar ação"><option value="">Todas as ações</option><option>Retirada</option><option>Devolução</option></select><span class="sp"></span><button class="btn" id="csv">${ICON.dl}Exportar CSV</button></div>
  <div class="card tw"><table><thead><tr><th>Data e hora</th><th>Ferramenta</th><th>UID</th><th>Usuário</th><th>Matrícula</th><th>Ação</th></tr></thead><tbody id="tb"></tbody></table></div>`;
}};
const vazio=(c,t,s)=>`<tr><td colspan="${c}"><div class="empty"><b>${t}</b>${s}</div></td></tr>`;
const T={
ferramentas(){
  const q=($('#q').value||'').toLowerCase();
  const l=S.ferr.filter(f=>(f.nome+f.uid).toLowerCase().includes(q));
  $('#tb').innerHTML=l.length?l.map(f=>`<tr><td><b>${esc(f.nome)}</b></td><td class="num">${esc(f.uid)}</td><td>${chip(f.status)}</td><td><div class="acts"><button class="btn sm" data-e="${f.id}">${ICON.edit}Editar</button><button class="btn sm del" data-d="${f.id}">${ICON.del}Excluir</button></div></td></tr>`).join(''):vazio(4,'Nenhuma ferramenta encontrada','Cadastre uma ferramenta com o UID da tag RFID.');
},
usuarios(){
  $('#tb').innerHTML=S.users.length?S.users.map(u=>`<tr><td><div class="u"><span class="av">${ini(u.nome)}</span><b>${esc(u.nome)}</b></div></td><td class="num">${esc(u.matricula)}</td><td>${S.ativo?.id===u.id?'<span class="chip ok">Operador atual</span>':`<button class="btn sm" data-a="${u.id}">Definir como operador</button>`}</td><td><div class="acts"><button class="btn sm" data-e="${u.id}">${ICON.edit}Editar</button><button class="btn sm del" data-d="${u.id}">${ICON.del}Excluir</button></div></td></tr>`).join(''):vazio(4,'Nenhum usuário cadastrado','Cadastre quem vai retirar ferramentas.');
},
historico(){
  const q=($('#q').value||'').toLowerCase(),a=$('#ac').value;
  const l=S.hist.filter(h=>(!a||h.acao===a)&&`${h.nome} ${h.usuario} ${h.matricula}`.toLowerCase().includes(q));
  S.filtrado=l;
  $('#tb').innerHTML=l.length?l.map(h=>`<tr><td class="num">${fmt(h.data_hora)}</td><td><b>${esc(h.nome||'Ferramenta removida')}</b></td><td class="num">${esc(h.uid||'-')}</td><td>${esc(h.usuario||'-')}</td><td class="num">${esc(h.matricula||'-')}</td><td>${acaoChip(h.acao)}</td></tr>`).join(''):vazio(6,'Nenhuma movimentação encontrada','Ajuste os filtros ou aproxime uma tag do leitor.');
}};
const refresh=async()=>{await carregar();render()};
const ligar={
ferramentas(){
  $('#q').oninput=T.ferramentas;
  $('#novo').onclick=()=>formDialog({title:'Nova ferramenta',submit:'Cadastrar',fields:[{name:'nome',label:'Nome',placeholder:'Ex.: Chave de fenda'},{name:'uid',label:'UID da tag RFID',placeholder:'E9 4F 15 05',hint:'Digite o UID ou use o botão para ler direto do leitor.',ler:true}],onSubmit:async v=>{await api('/api/ferramentas','POST',v);toast('Ferramenta cadastrada.');refresh()}});
  $('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.e){const f=S.ferr.find(x=>x.id==b.dataset.e);formDialog({title:'Editar ferramenta',submit:'Salvar alterações',fields:[{name:'nome',label:'Nome',value:f.nome},{name:'uid',label:'UID da tag RFID',value:f.uid,readonly:true}],onSubmit:async v=>{await api('/api/ferramentas/'+f.id,'PUT',{nome:v.nome});toast('Ferramenta atualizada.');refresh()}})}
    if(b.dataset.d){const f=S.ferr.find(x=>x.id==b.dataset.d);confirmDialog('Excluir ferramenta',`Excluir "${f.nome}"? Ferramentas com histórico não podem ser excluídas.`,'Excluir',async()=>{await api('/api/ferramentas/'+f.id,'DELETE');toast('Ferramenta excluída.');refresh()})}};
},
usuarios(){
  $('#novo').onclick=()=>formDialog({title:'Novo usuário',submit:'Cadastrar',fields:[{name:'nome',label:'Nome completo'},{name:'matricula',label:'Matrícula'}],onSubmit:async v=>{await api('/api/usuarios','POST',v);toast('Usuário cadastrado.');refresh()}});
  $('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.a){try{const r=await api('/api/usuario-ativo','POST',{usuario_id:b.dataset.a});S.ativo=r.usuario;desenharOperador();toast(`Operador definido: ${r.usuario.nome}`);render()}catch(er){toast(er.message,true)}}
    if(b.dataset.e){const u=S.users.find(x=>x.id==b.dataset.e);formDialog({title:'Editar usuário',submit:'Salvar alterações',fields:[{name:'nome',label:'Nome completo',value:u.nome},{name:'matricula',label:'Matrícula',value:u.matricula}],onSubmit:async v=>{await api('/api/usuarios/'+u.id,'PUT',v);toast('Usuário atualizado.');refresh()}})}
    if(b.dataset.d){const u=S.users.find(x=>x.id==b.dataset.d);confirmDialog('Excluir usuário',`Excluir "${u.nome}"? As movimentações dele continuam no histórico, sem o nome.`,'Excluir',async()=>{await api('/api/usuarios/'+u.id,'DELETE');toast('Usuário excluído.');refresh()})}};
},
historico(){
  $('#q').oninput=T.historico;$('#ac').onchange=T.historico;
  $('#csv').onclick=()=>{
    const l=S.filtrado||S.hist,c=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const linhas=[['Data e hora','Ferramenta','UID','Usuário','Matrícula','Ação'],...l.map(h=>[fmt(h.data_hora),h.nome,h.uid,h.usuario,h.matricula,h.acao])];
    const blob=new Blob(['\uFEFF'+linhas.map(r=>r.map(c).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='smart-stock-historico.csv';a.click();URL.revokeObjectURL(a.href)};
}};
const TITULOS={painel:'Painel',ferramentas:'Ferramentas',usuarios:'Usuários',historico:'Histórico'};
function render(){
  const p=(location.hash||'#painel').slice(1),v=V[p]?p:'painel';
  $('#titulo').textContent=TITULOS[v];document.title=`${TITULOS[v]} · Smart Stock`;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
  $('#view').innerHTML=V[v]();
  if(T[v])T[v]();ligar[v]?.();anima();
}
addEventListener('hashchange',render);

/* ---------- atualização ao vivo ---------- */
async function vivo(){
  try{
    const l=await api('/api/leitor');
    $('#dot').classList.add('up');$('#srv').textContent='Servidor online';
    $('#dotL').classList.toggle('up',!!l.conectado&&!!l.pronto);
    $('#leitor').textContent=l.conectado?(l.pronto?'Leitor pronto · '+l.porta:'Leitor iniciando…'):'Leitor desconectado';
    $('#leitor').parentElement.title=l.erro||'';
    const ev=l.evento;
    if(ev&&S.evId!==undefined&&ev.id!==S.evId){
      if(ev.tipo==='ok'){S.pulse=Date.now();toast(ev.mensagem);if(!$('#dlg').open)await refresh()}
      else if(ev.tipo==='sem_operador'||ev.tipo==='erro')toast(ev.mensagem,true);
      else if(ev.tipo==='nao_cadastrada'&&!S.lendo)toast(ev.mensagem,true);
    }
    S.evId=ev?ev.id:0;
  }catch{$('#dot').classList.remove('up');$('#dotL').classList.remove('up');$('#srv').textContent='Servidor offline'}
}
(async()=>{
  try{await carregar()}catch(e){toast(e.message,true)}
  render();await vivo();setInterval(vivo,2000);
})();
</script>
</body>
</html>
